services:
  - type: web
    name: spendsense-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    disk:
      name: spendsense-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/spendsense.db
      - key: UPLOAD_DIR
        value: /var/data/uploads/avatars
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
